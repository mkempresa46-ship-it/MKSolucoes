
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Caixa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📊 Controle de Caixa</h1>
    <p>Gestão financeira da sua empresa</p>
</header>

<main>
    <section class="cards">
        <div class="card">
            <h3>Total de Vendas</h3>
            <p id="totalVendas">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Total de Gastos</h3>
            <p id="totalGastos">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Saldo</h3>
            <p id="saldo">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Margem</h3>
            <p id="margem">0%</p>
        </div>
    </section>

    <section class="formulario">
        <h2>Nova movimentação</h2>

        <form id="formCaixa">
            <label>Tipo</label>
            <select id="tipo">
                <option value="venda">Venda</option>
                <option value="gasto">Gasto</option>
            </select>

            <label>Descrição</label>
            <input type="text" id="descricao"
                placeholder="Ex: Venda de produto" required>

            <label>Valor</label>
            <input type="number" id="valor"
                step="0.01" min="0.01" placeholder="0,00" required>

            <label>Data</label>
            <input type="date" id="data" required>

            <button type="submit">Adicionar movimentação</button>
        </form>
    </section>

    <section class="historico">
        <h2>Histórico de movimentações</h2>

        <table>
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaCaixa"></tbody>
        </table>
    </section>

    <section class="analise">
        <h2>💡 Análise financeira</h2>
        <div id="recomendacoes">
            Registre suas movimentações para receber recomendações.
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
